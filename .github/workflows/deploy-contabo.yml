name: Deploy Contabo

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Full tested main commit SHA (leave empty for current main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: stories-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'main' }}
          fetch-depth: 0

      - name: Require successful tests for this exact main revision
        id: tested
        uses: actions/github-script@v7
        with:
          script: |
            const {execFileSync} = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const main = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            if (main.data.commit.sha !== sha) {
              throw new Error('Deploy only the current main commit; refresh and test main first.');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id:'test.yml', head_sha:sha,
              event:'push', status:'completed', per_page:100
            });
            if (!runs.data.workflow_runs.some(run => run.head_sha === sha && run.conclusion === 'success')) {
              throw new Error('The Test workflow must pass on this exact main commit before deployment.');
            }
            core.setOutput('sha', sha);

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the tested revision
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/9dcw/stories-dashboard:${{ steps.tested.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.tested.outputs.sha }}

      - name: Release app and court runner together
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/stories-dashboard' }}
          DEPLOY_SHA: ${{ steps.tested.outputs.sha }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          fingerprint: ${{ secrets.CONTABO_HOST_FINGERPRINT }}
          envs: DOMAIN,DEPLOY_PATH,DEPLOY_SHA,REGISTRY_USER,REGISTRY_TOKEN
          command_timeout: 20m
          script: |
            set -eu
            umask 077
            : "${DOMAIN:?Set the production DOMAIN variable}"
            cd "$DEPLOY_PATH"
            git fetch origin main:refs/remotes/origin/main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA" || {
              echo 'Main changed after validation; run deployment again for tested main.'
              exit 1
            }
            IMAGE="ghcr.io/9dcw/stories-dashboard:$DEPLOY_SHA"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            PULL_SCRIPT=$(mktemp)
            RELEASE_SCRIPT=$(mktemp)
            trap 'rm -f "$PULL_SCRIPT" "$RELEASE_SCRIPT"' EXIT
            git show "$DEPLOY_SHA:deploy/pull-image.sh" > "$PULL_SCRIPT"
            bash "$PULL_SCRIPT" "$IMAGE"
            IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$IMAGE")
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_ID")" = "$DEPLOY_SHA"
            docker run --rm --network none --entrypoint cat "$IMAGE_ID" /app/scripts/release_court_intake.py > "$RELEASE_SCRIPT"
            python3 "$RELEASE_SCRIPT" --root "$DEPLOY_PATH" --image "$IMAGE_ID" \
              --revision "$DEPLOY_SHA" --health-url "https://$DOMAIN/api/v1/health"
