<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A fast mobile launchpad for stories, documents, sheets, and operations.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c6cff'/%3E%3Cpath d='M28 30h44v10H40v9h26v10H40v11h32v10H28z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <title>Stories Dashboard</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">OPERATIONS HUB</p>
        <h1>Stories Dashboard</h1>
        <p class="subtitle">Your fastest path to the work.</p>
      </div>
      <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle dark mode">☼</button>
    </header>

    <section class="hero-card">
      <div class="hero-copy">
        <span class="status-dot"></span>
        <span id="assetCount">Loading assets…</span>
        <h2>What do you need?</h2>
        <p>Search your Docs, Sheets, Drive folders, and operations links.</p>
      </div>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="Search stories, sheets, tags…" autocomplete="off">
        <button id="clearSearch" class="clear-search" type="button" aria-label="Clear search">×</button>
      </div>
    </section>

    <nav class="filters" id="filters" aria-label="Filter assets"></nav>

    <section class="section" id="recentSection" hidden>
      <div class="section-heading"><h2>Recent</h2><button class="text-button" id="clearRecent" type="button">Clear</button></div>
      <div class="card-grid" id="recentGrid"></div>
    </section>

    <section class="section">
      <div class="section-heading"><h2 id="resultsHeading">All assets</h2><span class="muted" id="resultsCount"></span></div>
      <div class="card-grid" id="assetGrid"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">⌕</div>
        <h3>No matching assets</h3>
        <p>Try a different search or category.</p>
      </div>
    </section>

    <footer>
      <span id="updatedAt">Data loading…</span>
      <a href="https://github.com/9dcw/Stories-dashboard" target="_blank" rel="noreferrer">Edit dashboard ↗</a>
    </footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
