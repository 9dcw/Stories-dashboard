<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020"><meta name="description" content="Story desk for Google Docs and Telegram conversations.">
  <link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css">
  <title>Stories Dashboard</title>
</head>
<body>
<main class="shell">
  <header class="topbar"><div><p class="eyebrow">STORY DESK</p><h1>Stories</h1><p class="subtitle">Pick a story. Open the work.</p></div><button class="icon-button" id="themeToggle" aria-label="Toggle dark mode">☼</button></header>
  <section class="hero-card"><div class="hero-copy"><span class="status-dot"></span><span id="storyCount">Loading stories…</span><h2>What are you working on?</h2><p>Every stub goes straight to its Doc and Telegram conversation.</p></div><div class="search-wrap"><span class="search-icon">⌕</span><input id="searchInput" type="search" placeholder="Search titles, people, hooks…" autocomplete="off"><button id="clearSearch" class="clear-search" aria-label="Clear search">×</button></div></section>
  <nav class="filters" id="filters" aria-label="Filter stories"></nav>
  <section class="section" id="recentSection" hidden><div class="section-heading"><h2>Recent</h2><button class="text-button" id="clearRecent">Clear</button></div><div class="story-grid" id="recentGrid"></div></section>
  <section class="section"><div class="section-heading"><h2 id="resultsHeading">All stories</h2><span class="muted" id="resultsCount"></span></div><div class="story-grid" id="storyGrid"></div><div class="empty-state" id="emptyState" hidden><div class="empty-icon">⌕</div><h3>No matching stories</h3><p>Try a different search or stage.</p></div></section>
  <footer><span id="updatedAt">Registry loading…</span><a href="https://github.com/9dcw/Stories-dashboard" target="_blank" rel="noreferrer">Edit dashboard ↗</a></footer>
</main><script src="./app.js" defer></script>
</body></html>
