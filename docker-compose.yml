services:
  app:
    image: ${STORIES_IMAGE:-ghcr.io/9dcw/stories-dashboard:latest}
    restart: unless-stopped
    env_file:
      - /etc/stories/stories.env
    volumes:
      - /srv/stories-dashboard/story-data:/app/story-data
      - /srv/stories-dashboard/backups:/app/backups
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stories

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - stories

volumes:
  caddy_data:
  caddy_config:

networks:
  stories: